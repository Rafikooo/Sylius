name: End-to-End (Generic)

on:
    workflow_call:
        inputs:
            branch:
                description: "Branch"
                required: false
                type: string
                default: ""
            php:
                description: "PHP version"
                required: true
                type: string
            symfony:
                description: "Symfony constraint"
                required: true
                type: string
            db:
                description: "Database engine (mysql|mariadb|postgresql)"
                required: true
                type: string
            db_version:
                description: "Database version"
                required: true
                type: string
            twig:
                description: "Twig constraint (MySQL only)"
                required: false
                type: string
                default: ""
            state_machine_adapter:
                description: "State machine adapter (MariaDB only)"
                required: false
                type: string
                default: "symfony_workflow"
            env:
                description: "APP_ENV value"
                required: false
                type: string
                default: "test_cached"
            unstable:
                description: "Use unstable dependencies (min-stability dev)"
                required: false
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    behat-no-js:
        continue-on-error: ${{ inputs.unstable }}
        runs-on: ubuntu-latest
        name: "Non-JS, PHP ${{ inputs.php }}, Symfony ${{ inputs.symfony }}, DB ${{ inputs.db }} ${{ inputs.db_version }}${{ inputs.db == 'mariadb' && format(', SM {0}', inputs.state_machine_adapter) || '' }}${{ inputs.db == 'mysql' && inputs.twig != '' && format(', Twig {0}', inputs.twig) || '' }}"
        timeout-minutes: 45

        env:
            APP_ENV: ${{ inputs.env }}
            DATABASE_URL: ${{ inputs.db == 'mysql' && format('mysql://root:root@127.0.0.1/sylius?charset=utf8mb4&serverVersion={0}', inputs.db_version) || inputs.db == 'mariadb' && format('mysql://root:root@127.0.0.1/sylius?charset=utf8mb4&serverVersion=mariadb-{0}', inputs.db_version) || inputs.db == 'postgresql' && format('pgsql://postgres:postgres@127.0.0.1/sylius?charset=utf8&serverVersion={0}', inputs.db_version) || '' }}
            TEST_SYLIUS_STATE_MACHINE_ADAPTER: ${{ inputs.state_machine_adapter }}

        steps:
            -   name: Set variables
                shell: bash
                env:
                    BRANCH: ${{ inputs.branch }}
                run: |
                    if [ "$BRANCH" == "1.14" ]; then
                        echo "NODE_VERSION=20.x" >> $GITHUB_ENV
                    elif [ "$BRANCH" == "2.0" ]; then
                        echo "NODE_VERSION=22.x" >> $GITHUB_ENV
                    else
                        echo "NODE_VERSION=24.x" >> $GITHUB_ENV
                    fi

            -   name: "Checkout (With Branch)"
                if: "${{ inputs.branch != '' }}"
                uses: actions/checkout@v4
                with:
                    ref: ${{ inputs.branch }}

            -   name: "Checkout"
                if: "${{ inputs.branch == '' }}"
                uses: actions/checkout@v4

            -   name: Require Winzou State Machine (MariaDB)
                if: ${{ inputs.db == 'mariadb' && inputs.state_machine_adapter == 'winzou_state_machine' }}
                run: |
                    composer require winzou/state-machine:^0.4 --no-update
                    composer require winzou/state-machine-bundle:^0.6 --no-update

            -   name: Change minimum-stability to dev (unstable)
                if: ${{ inputs.unstable }}
                run: |
                    composer config minimum-stability dev
                    composer config prefer-stable true

            -   name: Restrict Twig (MySQL)
                if: ${{ inputs.db == 'mysql' && inputs.twig == '^2.12' }}
                run: composer require --no-update --no-scripts --no-interaction "twig/twig:${{ inputs.twig }}"

            -   name: Prepare manifest.json files (non-1.14)
                if: "${{ inputs.branch != '1.14' }}"
                run: |
                    mkdir -p public/build/admin
                    mkdir -p public/build/shop
                    mkdir -p public/build/app/admin
                    mkdir -p public/build/app/shop
                    echo "{}" > public/build/admin/manifest.json
                    echo "{}" > public/build/shop/manifest.json
                    echo "{}" > public/build/app/admin/manifest.json
                    echo "{}" > public/build/app/shop/manifest.json

            -   name: Build application (MySQL)
                if: ${{ inputs.db == 'mysql' }}
                uses: SyliusLabs/BuildTestAppAction@v2.4
                with:
                    build_type: "sylius"
                    cache_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ inputs.symfony }}"
                    cache_restore_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ inputs.symfony }}"
                    e2e: "yes"
                    database_version: ${{ inputs.db_version }}
                    php_version: ${{ inputs.php }}
                    symfony_version: ${{ inputs.symfony }}
                    node_version: ${{ env.NODE_VERSION }}

            -   name: Build application (MariaDB)
                if: ${{ inputs.db == 'mariadb' }}
                uses: SyliusLabs/BuildTestAppAction@v2.4
                with:
                    build_type: "sylius"
                    cache_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-php-${{ inputs.php }}-symfony-${{ inputs.symfony }}-"
                    cache_restore_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-php-${{ inputs.php }}-symfony-${{ inputs.symfony }}-"
                    e2e: "yes"
                    database: "mariadb"
                    database_version: ${{ inputs.db_version }}
                    php_version: ${{ inputs.php }}
                    symfony_version: ${{ inputs.symfony }}
                    node_version: ${{ env.NODE_VERSION }}
                    chrome_version: stable

            -   name: Build application (PostgreSQL)
                if: ${{ inputs.db == 'postgresql' }}
                uses: SyliusLabs/BuildTestAppAction@v2.4
                with:
                    build_type: "sylius"
                    cache_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-php-${{ inputs.php }}-symfony-${{ inputs.symfony }}-"
                    cache_restore_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-php-${{ inputs.php }}-symfony-${{ inputs.symfony }}-"
                    e2e: "yes"
                    database: "postgresql"
                    database_version: ${{ inputs.db_version }}
                    php_version: ${{ inputs.php }}
                    symfony_version: ${{ inputs.symfony }}
                    node_version: ${{ env.NODE_VERSION }}
                    chrome_version: stable

            -   name: Fix permissions for Symfony logs directory (MySQL)
                if: ${{ inputs.db == 'mysql' }}
                run: |
                    LOGS_DIR=$(bin/console debug:container --parameter=kernel.logs_dir | grep 'kernel.logs_dir' | awk '{print $2}')
                    mkdir -p "$LOGS_DIR"
                    chmod -R 777 "$LOGS_DIR"

            -   name: Test installer (MySQL)
                if: ${{ inputs.db == 'mysql' }}
                run: bin/console sylius:install --no-interaction -vvv

            -   name: Run PHPUnit
                continue-on-error: ${{ inputs.unstable }}
                run: |
                    vendor/bin/phpunit --testsuite all --colors=always
                    vendor/bin/phpunit --testsuite="Sylius Test Suite" --colors=always

            -   name: Run CLI Behat
                run: vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="@cli&&~@todo" --suite-tags="@cli" || vendor/bin/behat --strict --no-interaction -vvv -f progress --tags="@cli&&~@todo" --suite-tags="@cli" --rerun

            -   name: Run non-UI Behat (PostgreSQL)
                if: ${{ inputs.db == 'postgresql' }}
                run: vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="~@todo&&~@cli&&~@no-postgres" --suite-tags="@api,@domain" || vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="~@todo&&~@cli&&~@no-postgres" --suite-tags="@api,@domain" --rerun

            -   name: Run non-UI Behat (MySQL/MariaDB)
                if: ${{ inputs.db != 'postgresql' }}
                run: vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="~@todo&&~@cli" --suite-tags="@api,@domain" || vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="~@todo&&~@cli" --suite-tags="@api,@domain" --rerun

            -   name: Run non-JS Behat (PostgreSQL)
                if: ${{ inputs.db == 'postgresql' }}
                run: vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="~@javascript&&~@mink:chromedriver&&~@todo&&~@cli&&~@no-postgres" --suite-tags="@hybrid,@ui" || vendor/bin/behat --strict --no-interaction -vvv -f progress --tags="~@javascript&&~@mink:chromedriver&&~@todo&&~@cli&&~@no-postgres" --suite-tags="@hybrid,@ui" --rerun

            -   name: Run non-JS Behat (MySQL/MariaDB)
                if: ${{ inputs.db != 'postgresql' }}
                run: vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="~@javascript&&~@mink:chromedriver&&~@todo&&~@cli" --suite-tags="@hybrid,@ui" || vendor/bin/behat --strict --no-interaction -vvv -f progress --tags="~@javascript&&~@mink:chromedriver&&~@todo&&~@cli" --suite-tags="@hybrid,@ui" --rerun

            -   name: Upload logs
                uses: actions/upload-artifact@v4
                if: failure()
                with:
                    name: "Logs (non-JS, PHP ${{ inputs.php }}, Symfony ${{ inputs.symfony }}, DB ${{ inputs.db }} ${{ inputs.db_version }}) - ${{ github.run_id }}-${{ github.run_number }}"
                    path: |
                        etc/build/
                        var/log
                    if-no-files-found: ignore
                    overwrite: true

    behat-ui-js-chromedriver:
        if: ${{ inputs.db == 'mysql' }}
        continue-on-error: ${{ inputs.unstable }}
        runs-on: ubuntu-latest
        name: "JS with Chromedriver, PHP ${{ inputs.php }}, Symfony ${{ inputs.symfony }} (${{ inputs.env }}), MySQL ${{ inputs.db_version }}${{ inputs.twig != '' && format(', Twig {0}', inputs.twig) || '' }}"
        timeout-minutes: 45

        env:
            APP_ENV: ${{ inputs.env }}
            DATABASE_URL: ${{ format('mysql://root:root@127.0.0.1/sylius?charset=utf8mb4&serverVersion={0}', inputs.db_version) }}

        steps:
            -   name: Set variables
                shell: bash
                env:
                    BRANCH: ${{ inputs.branch }}
                run: |
                    if [ "$BRANCH" == "1.14" ]; then
                        echo "NODE_VERSION=20.x" >> $GITHUB_ENV
                    elif [ "$BRANCH" == "2.0" ]; then
                        echo "NODE_VERSION=22.x" >> $GITHUB_ENV
                    else
                        echo "NODE_VERSION=24.x" >> $GITHUB_ENV
                    fi

            -   name: "Checkout (With Branch)"
                if: "${{ inputs.branch != '' }}"
                uses: actions/checkout@v4
                with:
                    ref: ${{ inputs.branch }}

            -   name: "Checkout"
                if: "${{ inputs.branch == '' }}"
                uses: actions/checkout@v4

            -   name: Get Composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            -   name: "Restore dependencies"
                uses: actions/cache@v4
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ inputs.symfony }}"
                    restore-keys: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ inputs.symfony }}"

            -   name: Restrict Twig (MySQL)
                if: inputs.twig == '^2.12'
                run: composer require --no-update --no-scripts --no-interaction "twig/twig:${{ inputs.twig }}"

            -   name: Change minimum-stability to dev (unstable)
                if: ${{ inputs.unstable }}
                run: |
                    composer config minimum-stability dev
                    composer config prefer-stable true

            -   name: Build application
                uses: SyliusLabs/BuildTestAppAction@v2.4
                with:
                    build_type: "sylius"
                    cache_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ inputs.symfony }}"
                    cache_restore_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ inputs.symfony }}"
                    e2e: "yes"
                    e2e_js: "yes"
                    database_version: ${{ inputs.db_version }}
                    php_version: ${{ inputs.php }}
                    symfony_version: ${{ inputs.symfony }}
                    node_version: ${{ env.NODE_VERSION }}

            -   name: Run Behat (Chromedriver)
                run: |
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="@mink:chromedriver&&~@todo&&~@cli&&~@failing" --suite-tags="@hybrid,@ui" || \
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="@mink:chromedriver&&~@todo&&~@cli&&~@failing" --suite-tags="@hybrid,@ui" --rerun || \
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="@mink:chromedriver&&~@todo&&~@cli&&~@failing" --suite-tags="@hybrid,@ui" --rerun

            -   name: Run Behat (Chromedriver) for randomly failing scenarios (@failing)
                run: |
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="@mink:chromedriver&&~@todo&&~@cli&&@failing" --suite-tags="@hybrid,@ui" || \
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="@mink:chromedriver&&~@todo&&~@cli&&@failing" --suite-tags="@hybrid,@ui" --rerun || \
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="@mink:chromedriver&&~@todo&&~@cli&&@failing" --suite-tags="@hybrid,@ui" --rerun
                continue-on-error: true

            -   name: Upload logs
                uses: actions/upload-artifact@v4
                if: failure()
                with:
                    name: "Logs (JS with Chromedriver, PHP ${{ inputs.php }}, Symfony ${{ inputs.symfony }}, MySQL ${{ inputs.db_version }}) - ${{ github.run_id }}-${{ github.run_number }}"
                    path: |
                        etc/build/
                        var/log
                    if-no-files-found: ignore
                    overwrite: true

    behat-ui-js-panther:
        if: ${{ inputs.db == 'mysql' }}
        continue-on-error: ${{ inputs.unstable }}
        runs-on: ubuntu-latest
        name: "JS with Panther, PHP ${{ inputs.php }}, Symfony ${{ inputs.symfony }} (${{ inputs.env }}), MySQL ${{ inputs.db_version }}${{ inputs.twig != '' && format(', Twig {0}', inputs.twig) || '' }}"
        timeout-minutes: 45

        env:
            APP_ENV: ${{ inputs.env }}
            DATABASE_URL: ${{ format('mysql://root:root@127.0.0.1/sylius?charset=utf8mb4&serverVersion={0}', inputs.db_version) }}

        steps:
            -   name: Set variables
                shell: bash
                env:
                    BRANCH: ${{ inputs.branch }}
                run: |
                    if [ "$BRANCH" == "1.14" ]; then
                        echo "NODE_VERSION=20.x" >> $GITHUB_ENV
                    elif [ "$BRANCH" == "2.0" ]; then
                        echo "NODE_VERSION=22.x" >> $GITHUB_ENV
                    else
                        echo "NODE_VERSION=24.x" >> $GITHUB_ENV
                    fi

            -   name: "Checkout (With Branch)"
                if: "${{ inputs.branch != '' }}"
                uses: actions/checkout@v4
                with:
                    ref: ${{ inputs.branch }}

            -   name: "Checkout"
                if: "${{ inputs.branch == '' }}"
                uses: actions/checkout@v4

            -   name: Get Composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            -   name: "Restore dependencies"
                uses: actions/cache@v4
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ inputs.symfony }}"
                    restore-keys: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ inputs.symfony }}"

            -   name: Restrict Twig (MySQL)
                if: inputs.twig == '^2.12'
                run: composer require --no-update --no-scripts --no-interaction "twig/twig:${{ inputs.twig }}"

            -   name: Change minimum-stability to dev (unstable)
                if: ${{ inputs.unstable }}
                run: |
                    composer config minimum-stability dev
                    composer config prefer-stable true

            -   name: Build application for Full 1.14 build
                if: "${{ inputs.branch == '1.14' }}"
                uses: SyliusLabs/BuildTestAppAction@v2.3
                with:
                    build_type: "sylius"
                    cache_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ inputs.symfony }}"
                    cache_restore_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ inputs.symfony }}"
                    e2e: "yes"
                    e2e_js: "yes"
                    database_version: ${{ inputs.db_version }}
                    php_version: ${{ inputs.php }}
                    symfony_version: ${{ inputs.symfony }}
                    node_version: ${{ env.NODE_VERSION }}
                    chrome_version: stable

            -   name: Build application
                if: "${{ inputs.branch != '1.14' }}"
                uses: SyliusLabs/BuildTestAppAction@v2.4
                with:
                    build_type: "sylius"
                    cache_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ inputs.symfony }}"
                    cache_restore_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ inputs.symfony }}"
                    e2e: "yes"
                    e2e_js: "yes"
                    database_version: ${{ inputs.db_version }}
                    php_version: ${{ inputs.php }}
                    symfony_version: ${{ inputs.symfony }}
                    node_version: ${{ env.NODE_VERSION }}
                    chrome_version: stable

            -   name: Run Behat (Panther)
                run: vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="@javascript&&~@todo&&~@cli" --suite-tags="@hybrid,@ui" || vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="@javascript&&~@todo&&~@cli" --suite-tags="@hybrid,@ui" --rerun || vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="@javascript&&~@todo&&~@cli" --suite-tags="@hybrid,@ui" --rerun

            -   name: Upload logs
                uses: actions/upload-artifact@v4
                if: failure()
                with:
                    name: "Logs (JS with Panther, PHP ${{ inputs.php }}, Symfony ${{ inputs.symfony }}, MySQL ${{ inputs.db_version }}) - ${{ github.run_id }}-${{ github.run_number }}"
                    path: |
                        etc/build/
                        var/log
                    if-no-files-found: ignore
                    overwrite: true

